  function translatePage(root){
    if(lang === "ko" || !root) return;
    var dict = {};
    Object.keys(UI_DICT).forEach(function(k){ if(UI_DICT[k][lang]) dict[k] = UI_DICT[k][lang]; });
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var node;
    while((node = walker.nextNode())){
      var trimmed = node.nodeValue.trim();
      if(trimmed && dict[trimmed] != null){
        node.nodeValue = node.nodeValue.replace(trimmed, dict[trimmed]);
      }
    }
    root.querySelectorAll("[aria-label],[alt],[placeholder]").forEach(function(el){
      ["aria-label","alt","placeholder"].forEach(function(attr){
        var v = el.getAttribute(attr);
        if(v && dict[v] != null) el.setAttribute(attr, dict[v]);
      });
    });
  }

  /* 자아찾기 앱에서 ?prio=see,story,shot&type=IF 형태로 넘어온 경우 그 값을 받는다 */
  (function importFromSelfMap(){
    var qp = new URLSearchParams(window.__TRAVEL_SEARCH__ || location.search);
    var urlLang = qp.get("lang");
    if(urlLang && ["ko","en","zh","ja"].indexOf(urlLang) >= 0){
      lang = urlLang;
      try{ localStorage.setItem(LANG_KEY, urlLang); }catch(e){}
    }
    var raw = qp.get("prio");
    if(!raw) return;
    var valid = raw.split(",").map(function(x){ return x.trim(); })
      .filter(function(k){ return CI[k] !== undefined; }).slice(0, 3);
    if(!valid.length) return;
    state = { step:STEPS.length, area:"JJ", prio:valid, who:null, walk:null, move:null,
      fromSelfMap:true, selfType:qp.get("type") || "" };
    resumable = false;
    save();
  })();

  /* 위치 권한은 결과 화면에 도착해서야 물으면 이미 기본 코스가 한 번 뜬 뒤라
     화면이 바뀌는 게 어색하다. 그래서 앱을 여는 시점(질문에 답하는 동안)에
     미리 물어보고, 결과 화면에서는 이미 받아둔 좌표를 바로 쓴다.
     또한 아침엔 서쪽, 낮엔 동쪽, 저녁엔 남쪽처럼 이동하며 여러 번 검색할
     수 있으므로 한 번만 확인하고 끝내지 않고 watchPosition으로 계속
     갱신해둔다 — "기준 바꾸기"·"처음부터"로 다시 검색할 때마다 renderResult()가
     이 시점의 최신 좌표를 읽어 그때그때 반영한다. */
  var earlyGeo = null;
  if(navigator.geolocation){
    navigator.geolocation.watchPosition(function(pos){
      var onJeju = pos.coords.latitude >= 33.05 && pos.coords.latitude <= 33.60
        && pos.coords.longitude >= 126.05 && pos.coords.longitude <= 126.99;
      earlyGeo = { lat: pos.coords.latitude, lng: pos.coords.longitude, onJeju: onJeju };
    }, function(){ /* 거부·실패 — 기본 코스로 진행 */ }, { enableHighAccuracy:false, maximumAge:60000, timeout:8000 });
  }

  /* ============ 채점 ============ */

  var PW = [3, 2, 1.2];   // 1·2·3순위 가중치
  var BASEW = 0.35;       // 고르지 않은 기준의 기본 가중치

  function weights(){
    var w = {};
    CK.forEach(function(k){ w[k] = BASEW; });
    state.prio.forEach(function(k, i){ w[k] = PW[i] || 1; });
    return w;
  }

  function scoreSpot(sp, w){
    var sum = 0, wsum = 0;
    CK.forEach(function(k, i){
      sum += w[k] * sp.s[i];
      wsum += w[k];
    });
    var v = sum / (wsum * 5) * 100;

    if(state.who && sp.w.indexOf(state.who) < 0) v -= 10;
    if(state.walk === "low"){ if(sp.ef === 3) v -= 20; else if(sp.ef === 2) v -= 7; }
    else if(state.walk === "mid"){ if(sp.ef === 3) v -= 7; }
    else if(state.walk === "high"){ if(sp.ef === 1) v -= 2; }
    if(state.move === "tran") v -= (5 - sp.s[CI.easy]) * 3;
    if((state.who === "family" || state.who === "parents") && sp.ef === 3) v -= 6;

    return v;
  }

  function scored(){
    var w = weights();
    return SPOT.map(function(sp){
      return { sp:sp, v:scoreSpot(sp, w) };
    });
  }

  function regionRank(list){
    var by = {};
    list.forEach(function(it){
      (by[it.sp.r] = by[it.sp.r] || []).push(it.v);
    });
    var out = [];
    Object.keys(by).forEach(function(r){
      /* 상위 5개 평균은 스팟이 많은 지역(제주 13곳 vs 그 외 4~7곳)이 후보군
         크기만으로 계속 유리해지는 구조였다. 3개로 줄여 그 영향을 낮춘다. */
      var a = by[r].slice().sort(function(x, y){ return y - x; }).slice(0, 3);
      var m = a.reduce(function(p, c){ return p + c; }, 0) / a.length;
      out.push({ r:r, v:m });
    });

    /* 제주 안에서 검색 중이면 위치를 권역 선택의 1순위로 삼는다 — 취향은
       그 안에서 스팟을 고르는 데(scoreSpot/buildCourseVariant)는 계속 쓰이지만,
       "어느 권역을 보여줄지"는 가까운 제주 권역 순으로 확정한다. v(취향 점수)는
       그대로 둬서 매칭률 표시(pct(r.v))에는 영향 없다. */
    if(earlyGeo && earlyGeo.onJeju){
      out.forEach(function(o){
        if(isJejuRegion(o.r) && REGION[o.r]){
          o._dist = haversineKm(earlyGeo.lat, earlyGeo.lng, REGION[o.r].lat, REGION[o.r].lng);
        }
      });
      out.sort(function(a, b){
        var aJJ = a._dist != null, bJJ = b._dist != null;
        if(aJJ && bJJ) return a._dist - b._dist;   // 제주 권역끼리는 가까운 순
        if(aJJ !== bJJ) return aJJ ? -1 : 1;         // 제주 권역이 항상 앞
        return b.v - a.v;                            // 제주 권역이 아니면 취향 순
      });
      return out;
    }

    out.sort(function(a, b){ return b.v - a.v; });
    return out;
  }

  /* ============ 권역 내 이동시간(분) — 실측 대신 평균 주행시간 추정치 ============
     같은 시·군은 표기하지 않고, 다른 시·군으로 넘어갈 때만 참조합니다.
     기록 안 된 조합은 fallback(권역 평균 25분)으로 대체됩니다.
  ================================================================== */
  var TRAVEL = {
    JJC:{ "제주시|제주시 조천":20 },
    JJE:{ "서귀포 성산|서귀포 표선":20, "서귀포 성산|제주 구좌":20, "서귀포 표선|제주 구좌":25 },
    JJS:{ "서귀포|서귀포 남원":20, "서귀포|서귀포 중문":15, "서귀포|서귀포 하효":15, "서귀포|서귀포 호근":10,
          "서귀포 남원|서귀포 중문":25, "서귀포 남원|서귀포 하효":15, "서귀포 남원|서귀포 호근":20,
          "서귀포 중문|서귀포 하효":15, "서귀포 중문|서귀포 호근":10, "서귀포 하효|서귀포 호근":15 },
    JJW:{ "제주 애월|제주 한림":15, "제주 한림|제주 한경":15, "제주 애월|제주 한경":25,
          "서귀포 안덕|제주 한림":30, "서귀포 안덕|제주 한경":20, "서귀포 안덕|제주 애월":40 },
  };
  var TRAVEL_FALLBACK = 25;

  function travelMin(region, a, b){
    if(a === b) return 0;
    var m = TRAVEL[region];
    if(m){
      var v = m[a + "|" + b]; if(v != null) return v;
      v = m[b + "|" + a]; if(v != null) return v;
    }
    return TRAVEL_FALLBACK;
  }

  var SLOTS = [
    { k:"m", t:"오전", h:"09:00" },
    { k:"l", t:"점심", h:"12:30" },
    { k:"a", t:"오후", h:"14:30" },
    { k:"s", t:"노을", h:"18:00" },
    { k:"e", t:"저녁", h:"19:30" }
  ];

  var TRAVEL_PENALTY = 3.5;   // 이동 1분당 매칭 점수 감점 — 웬만하면 같은 동네 안에서 하루가 끝나도록 세게 건다
                               // (예: 서귀동만 해도 볼거리가 몰려 있는데 굳이 중문·남원까지 넘어갈 필요는 없다는 피드백 반영)

  /* 5일장은 정해진 날짜에만 열린다 — 날짜 끝자리 기준(세화 5·10일, 한림 4·9일).
     장이 안 서는 날엔 후보에서 아예 빼서 문 닫은 곳을 추천하지 않게 한다. */
  var MARKET_DAYS = { "세화 민속오일장":[5,0], "한림민속오일장":[4,9] };
  function isMarketOpenToday(name){
    var days = MARKET_DAYS[name];
    if(!days) return true;
    return days.indexOf(new Date().getDate() % 10) >= 0;
  }

  /* 비가 와야만 실제로 볼거리가 생기는 스팟(예: 엉또폭포는 평소엔 마른 절벽,
     비가 많이 온 뒤에만 폭포가 생기는 건천 폭포). 맑은 날 추천하면 가서
     보니 그냥 절벽이라 실망하게 되므로, 오늘 날씨가 비/눈일 때만 후보에
     넣는다. 날씨를 아직 확인 전(badWeather 정보 없음)이면 일단 빼둔다 —
     맑을 확률이 더 높은 쪽으로 안전하게 기본값을 잡는다. */
  var RAIN_ONLY_SPOTS = { "엉또폭포": true };
  function isRainReady(name, badWeather){
    if(!RAIN_ONLY_SPOTS[name]) return true;
    return !!badWeather;
  }

  /* ============ 코스 후보 풀 — 지역·기준 조합마다 최대 20개까지 =============
     예전엔 매번 1등 스팟만 고정으로 골라서, 같은 지역·같은 기준이면 사람이
     달라도 항상 똑같은 코스가 나왔다. 슬롯별로 상위 후보 중 하나를 시드
     기반으로 고르는 방식으로 바꿔, 지역+기준 조합마다 최대 20개의 서로
     다른 코스가 나오게 한다(작은 지역은 후보가 적어 20개가 안 나올 수 있음).
     시드가 "지역+기준"에서만 나오므로 같은 조합이면 풀 자체는 항상 재현되고,
     그중 어떤 걸 보여줄지만 날짜/위치로 바뀐다. ==================== */

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function daySeed(){
    var d = new Date();
    return d.getFullYear() * 372 + (d.getMonth() + 1) * 31 + d.getDate();
  }
  function scenarioSeed(region, w){
    var s = 0;
    Object.keys(w).sort().forEach(function(k){
      s = (s * 131 + k.charCodeAt(0) * 7 + Math.round(w[k] * 10)) >>> 0;
    });
    for(var i = 0; i < region.length; i++) s = (s * 131 + region.charCodeAt(i)) >>> 0;
    return s;
  }
  function courseKey(course){
    return course.map(function(lg){ return lg.it.sp.n; }).sort().join("|");
  }

  /* 개별 스팟 좌표는 없어서, 시·군/동네 단위 좌표로 "가장 가까운 코스"를 고른다.
     지금은 selfmap 8유형이 전부 제주로 귀결되어 제주만 채워둠. */
  var CITY_LOC = {
    "제주시":{lat:33.4996,lng:126.5312}, "제주시 조천":{lat:33.5397,lng:126.6392},
    "서귀포 성산":{lat:33.4587,lng:126.9425}, "서귀포 표선":{lat:33.3536,lng:126.8168},
    "제주 구좌":{lat:33.5262,lng:126.8511}, "서귀포":{lat:33.2541,lng:126.5601},
    "서귀포 남원":{lat:33.2800,lng:126.7208}, "서귀포 중문":{lat:33.2495,lng:126.4139},
    "서귀포 하효":{lat:33.2459,lng:126.5896}, "서귀포 호근":{lat:33.2378,lng:126.5347},
    "서귀포 안덕":{lat:33.2497,lng:126.3309}, "제주 애월":{lat:33.4626,lng:126.3306},
    "제주 한경":{lat:33.3572,lng:126.1836}, "제주 한림":{lat:33.4111,lng:126.2683}
  };

  var INDOOR_BONUS = 22;

  function buildCourseVariant(pool, region, rng, anchorCity, badWeather){
    var used = {}, course = [];
    SLOTS.forEach(function(sl, slotIdx){
      var prevCity = course.length ? course[course.length - 1].it.sp.c : null;
      var baseCand = pool.filter(function(it){
        return it.sp.sl.indexOf(sl.k) >= 0 && !used[it.sp.n] && isMarketOpenToday(it.sp.n)
          && isRainReady(it.sp.n, badWeather);
      });
      // 앵커 동네(anchorCity) 안에서 하루를 끝내는 게 원칙 — 모든 슬롯이
      // 우선 같은 동네 후보만 본다. 그 동네에 이 시간대 후보가 정말 하나도
      // 없을 때만 지역 전체 후보로 자연스럽게 되돌아간다.
      var anchored = anchorCity
        ? baseCand.filter(function(it){ return it.sp.c === anchorCity; })
        : [];
      var cand = (anchored.length ? anchored : baseCand).map(function(it){
        var penalty = prevCity ? travelMin(region, prevCity, it.sp.c) * TRAVEL_PENALTY : 0;
        var weatherAdj = badWeather && it.sp.ind ? INDOOR_BONUS : 0;
        return { it:it, adj:it.v - penalty + weatherAdj };
      }).sort(function(a, b){ return b.adj - a.adj; });

      if(!cand.length) return;
      if(cand[0].it.v < 50 && course.length >= 3) return;

      // 항상 1등만 고르면 코스가 매번 똑같아지니, 상위 몇 개 중 하나를 시드로 고른다
      var shortlist = cand.slice(0, Math.min(4, cand.length));
      var chosen = shortlist[Math.floor(rng() * shortlist.length)];
      var sp = chosen.it.sp;
      var sameCity = prevCity === null || prevCity === sp.c;
      used[sp.n] = 1;
      course.push({
        slot:sl,
        it:chosen.it,
        alt:cand[1] ? cand[1].it.sp.n : null,
        move: sameCity ? null : { city:sp.c, min:travelMin(region, prevCity, sp.c) }
      });
    });
    return course;
  }

  function buildCoursePool(list, region, maxN, badWeather){
    var pool0 = list.filter(function(it){ return it.sp.r === region; })
                     .sort(function(a, b){ return b.v - a.v; });
    if(!pool0.length) return [];
    var baseSeed = scenarioSeed(region, weights());
    var seen = {}, variants = [];

    /* 이동 페널티를 세게 걸어 동네 안에서 코스가 끝나게 했더니, 그냥 무작위로
       뽑으면 스팟이 제일 많은 동네로만 20개가 죄다 쏠려서, "내 위치 기준으로"
       골라도 다른 동네엔 고를 게 없어지는 문제가 생긴다. 그래서 이 지역에
       실제로 있는 동네들을 돌아가며 앵커로 삼아, 동네마다 시작하는 코스가
       고르게 풀에 들어가도록 한다 — 동네마다 손으로 코스를 새로 만들 필요 없이
       자동으로 위치 커버리지가 생긴다. */
    var cities = [];
    pool0.forEach(function(it){ if(cities.indexOf(it.sp.c) < 0) cities.push(it.sp.c); });

    var attempts = 0, maxAttempts = maxN * 10;
    while(variants.length < maxN && attempts < maxAttempts){
      var anchorCity = cities.length ? cities[attempts % cities.length] : null;
      var rng = mulberry32((baseSeed + attempts * 7919) >>> 0);
      var course = buildCourseVariant(pool0, region, rng, anchorCity, badWeather);
      if(course.length){
        var key = courseKey(course);
        if(!seen[key]){ seen[key] = 1; variants.push(course); }
      }
      attempts++;
    }
    return variants;
  }

  function nearestVariant(pool, userLat, userLng){
    var best = null, bestD = Infinity;
    pool.forEach(function(course){
      var first = course[0];
      var loc = first && CITY_LOC[first.it.sp.c];
      if(!loc) return;
      var d = haversineKm(userLat, userLng, loc.lat, loc.lng);
      if(d < bestD){ bestD = d; best = course; }
    });
    return best;
  }

  /* ============ 오늘의 날씨 ============
     WMO 날씨 코드 → 비/눈처럼 야외 코스가 불편한 날씨인지만 판단한다.
     기온·풍속까지 반영하면 정확도보다 복잡도가 더 빨리 올라가서, 이번엔
     "젖는지 아닌지"로 단순화했다. */
  var BAD_WMO = [51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99];
  var WMO_LABEL = {
    0:["맑음","☀️"], 1:["대체로 맑음","🌤"], 2:["구름 조금","⛅"], 3:["흐림","☁️"],
    45:["안개","🌫"], 48:["안개","🌫"],
    51:["이슬비","🌦"], 53:["이슬비","🌦"], 55:["이슬비","🌦"],
    56:["언 이슬비","🌦"], 57:["언 이슬비","🌦"],
    61:["비","🌧"], 63:["비","🌧"], 65:["강한 비","🌧"],
    66:["언 비","🌧"], 67:["언 비","🌧"],
    71:["눈","❄️"], 73:["눈","❄️"], 75:["강한 눈","❄️"], 77:["싸락눈","❄️"],
    80:["소나기","🌦"], 81:["소나기","🌦"], 82:["강한 소나기","🌧"],
    85:["눈 소나기","🌨"], 86:["눈 소나기","🌨"],
    95:["뇌우","⛈"], 96:["뇌우","⛈"], 99:["강한 뇌우","⛈"]
  };
  function todayKey(){ var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }

  function fetchWeather(region){
    state._weather = state._weather || {};
    var cur = state._weather[region];
    if(cur && cur.day === todayKey()) return Promise.resolve(cur);
    var RG = REGION[region];
    if(!RG) return Promise.resolve(null);
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + RG.lat + "&longitude=" + RG.lng
      + "&current=temperature_2m,weather_code&timezone=Asia%2FSeoul";
    return fetch(url).then(function(r){ return r.json(); }).then(function(data){
      var c = data && data.current;
      if(!c) return null;
      var code = c.weather_code;
      var info = { code:code, temp:Math.round(c.temperature_2m), bad:BAD_WMO.indexOf(code) >= 0, day:todayKey() };
      state._weather[region] = info;
      save();
      return info;
    }).catch(function(){ return null; });
  }

  function buildCourse(list, region){
    var w = state._weather && state._weather[region];
    var badWeather = !!(w && w.bad);
    var pool = buildCoursePool(list, region, 20, badWeather);
    if(!pool.length) return [];
    if(state._geo && state._geo.region === region){
      var near = nearestVariant(pool, state._geo.lat, state._geo.lng);
      if(near) return near;
    }
    var idx = Math.abs((scenarioSeed(region, weights()) + daySeed()) % pool.length);
    return pool[idx];
  }

  function pct(v){ return Math.max(38, Math.min(99, Math.round(v))); }

  /* 코스의 각 구간에 붙일 제휴 매장을 찾는다 — 같은 권역·같은 시군·같은 시간대 */
  function partnerFor(sp, slotKey, usedNames){
    var live = null, open = null;
    PARTNER.forEach(function(t){
      if(t.r !== sp.r || t.c !== sp.c) return;
      if(t.sl.indexOf(slotKey) < 0) return;
      if(t.st === "live"){ if(!live && !usedNames[t.n]) live = t; }
      else if(!open) open = t;
    });
    return live || open;
  }

  /* ============ 유틸 ============ */

  var app = document.getElementById("app");

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
  }
  function hasJong(str){
    var s = String(str).replace(/[^가-힣]/g, "");
    if(!s) return false;
    var ch = s.charCodeAt(s.length - 1);
    return (ch - 0xAC00) % 28 !== 0;
  }
  function josa(w, a, b){ return hasJong(w) ? a : b; }
  function haversineKm(lat1, lng1, lat2, lng2){
    var R = 6371, toRad = function(d){ return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
      + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  /* '으로/로' 전용 — 받침이 ㄹ이면 '로', 받침 없어도 '로', 그 외 받침은 '으로' */
  function roJosa(w){
    var s = String(w).replace(/[^가-힣]/g, "");
    if(!s) return "로";
    var jong = (s.charCodeAt(s.length - 1) - 0xAC00) % 28;
    return (jong === 0 || jong === 8) ? "로" : "으로";
  }
  function mapURL(q){ return "https://map.naver.com/p/search/" + encodeURIComponent(q); }

  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2200);
  }

  function scan(i){
    var h = "";
    for(var j = 0; j < STEPS.length; j++){
      h += '<i class="' + (j < i ? "done" : j === i ? "now" : "") + '"></i>';
    }
    var LB = { area:"지역", prio:"중요한 것", who:"동행", walk:"체력", move:"이동" };
    return '<div><div class="scan">' + h + '</div><div class="scanlab">'
      + '<span class="tag on">' + LB[STEPS[i]] + '</span>'
      + '<span class="tag">' + (i + 1) + ' / ' + STEPS.length + '</span></div></div>';
  }

  function pickGrid(opts, cur, cls){
    var h = '<div class="picks">';
    opts.forEach(function(o){
      h += '<button class="pick" data-v="' + esc(o.v) + '" aria-pressed="'
        + (String(cur) === String(o.v) ? "true" : "false") + '"><span>' + esc(o.t)
        + (o.s ? '<small>' + esc(o.s) + '</small>' : '') + '</span></button>';
    });
    return h + '</div>';
  }
  /* ============ 화면 ============ */

  var THEME_WORD = {
    see:"눈에 담고", eat:"실컷 먹고", do:"직접 해보고", story:"이야기를 듣고",
    shot:"사진으로 남기고", easy:"무리 없이 움직이고", worth:"아깝지 않게 쓰고"
  };

  function activeCampaigns(regionKey){
    var today = new Date(); today.setHours(0,0,0,0);
    var soon = new Date(today.getTime() + 14 * 86400000); // 14일 안에 시작하는 행사도 미리 보여준다
    return CAMPAIGN.filter(function(cm){
      if(cm.status !== "confirmed") return false;
      if(cm.region.indexOf("ALL") < 0 && cm.region.indexOf(regionKey) < 0) return false;
      var st = new Date(cm.start), en = new Date(cm.end);
      return today <= en && st <= soon;
    });
  }

  function render(){
    window.scrollTo(0, 0);

  function hhmmToMin(hhmm){

  function durationLabel(course){

    var total = endMin - startMin;
    var hh = Math.floor(total / 60), mm = total % 60;
    return course[0].slot.h + ' 시작 → 약 ' + String(Math.floor(endMin / 60)).padStart(2, "0") + ':' + String(endMin % 60).padStart(2, "0") + ' 종료'

  function svgWordLines(text, limit){

    words.forEach(function(word){ if(line && (line + " " + word).length > limit){lines.push(line);line=word;}else line += (line ? " " : "") + word; });

    return lines;

  function fileToDataURI(url){
    return fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
      return new Promise(function(resolve, reject){
        var reader = new FileReader();
        reader.onload = function(){ resolve(reader.result); };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    });
  }

  function svgToBlobPNG(svgEl, scale){
    return (async function(){
      try{
        var w = +svgEl.getAttribute("width"), h = +svgEl.getAttribute("height");
        var clone = svgEl.cloneNode(true);
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        // <image href="img/...">를 그대로 두면, blob URL로 분리된 SVG를 <img>로 그릴 때
        // 브라우저가 보안상 그 안의 외부 리소스 요청을 막아 사진이 깨진 아이콘으로 나온다.
        // 요청 자체가 필요 없도록 사진을 미리 data URI로 인라인한다.
        var imgEls = Array.prototype.slice.call(clone.querySelectorAll("image"));
        await Promise.all(imgEls.map(async function(im){
          var href = im.getAttribute("href");
          if(!href) return;
          try{
            var dataUri = href.indexOf("data:") === 0 ? href : await fileToDataURI(new URL(href, document.baseURI).href);
            im.setAttribute("href", dataUri);
          }catch(e){ im.remove(); }
        }));
        var xml = new XMLSerializer().serializeToString(clone);
        var svgBlob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
        var url = URL.createObjectURL(svgBlob);
        return await new Promise(function(resolve){
          var img = new Image();
          img.onload = function(){
            var cv = document.createElement("canvas");
            cv.width = w * scale; cv.height = h * scale;
            var ctx = cv.getContext("2d");
            ctx.drawImage(img, 0, 0, cv.width, cv.height);
            URL.revokeObjectURL(url);
            cv.toBlob(function(blob){ resolve(blob); }, "image/png");
          };
          img.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
          img.src = url;
        });
      }catch(e){ return null; }
    })();
  }

          toast("저장했습니다");

        return;
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "나의하루_코스" + (idx + 1) + ".png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);

  document.documentElement.dataset.embedded = window.parent !== window ? "true" : "false";
  var homeButton = document.getElementById("appHome");
  if(homeButton) homeButton.onclick = function(){ resumable = !!(state.prio && state.prio.length); state.step = -1; save(); render(); };

  var langSwitchEl = document.getElementById("langSwitch");
  if(langSwitchEl){
    langSwitchEl.querySelectorAll("button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
      b.onclick = function(){ setLang(b.dataset.lang); };
    });
  }

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ if(state.step >= STEPS.length) render(); });
  }

  render();
})();
</script>
</body>
</html>
